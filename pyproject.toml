[project]
name = "pelagic-maritime-intelligence"
version = "0.1.0"
description = "Evidence-led maritime investigation prototype"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "psycopg[binary]>=3.2,<4", "pydantic>=2.10,<3", "shapely>=2.1,<3", "pyproj>=3.7,<4", "argon2-cffi>=23.1", "python-dotenv>=1.0", "numpy>=2.2,<3"]
[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "ruff>=0.16.8",
]
[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "ruff>=0.16.8",
]
[tool.setuptools.packages.find]
where = ["api"]

[tool.pytest.ini_options]
pythonpath = ["api"]
testpaths = ["tests"]
