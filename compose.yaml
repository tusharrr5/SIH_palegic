# ==============================================================================
# PALEGIC SIH 2026 — Unified Production Docker Compose Stack
# ==============================================================================
# Architecture:
#   Public Port 80 (Proxy) ──> Next.js (web:3000) & FastAPI (api:8100)
#                                                     │
#                                                     └──> PostgreSQL/PostGIS (db:5432)
# ==============================================================================

version: '3.9'

services:
  # 1. Geospatial Database (PostgreSQL 17 + PostGIS 3.5)
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maritime_oil_v2}
      POSTGRES_USER: ${POSTGRES_USER:-pelagic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - pelagic_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pelagic} -d ${POSTGRES_DB:-maritime_oil_v2}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # 2. Database Bootstrap & Canonical Incident Seeding (One-off initialization)
  init-db:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: >
      sh -c "python scripts/bootstrap.py && python scripts/seed_ennore.py"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pelagic}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-maritime_oil_v2}
    networks:
      - pelagic_net
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # 3. FastAPI Python Backend Service
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pelagic}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-maritime_oil_v2}
      ORIGIN: ${ORIGIN:-http://localhost}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost,http://localhost:3000,http://127.0.0.1:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SECRET_KEY: ${SECRET_KEY:-sih-2026-production-secret-key-change-me}
      ENVIRONMENT: production
    networks:
      - pelagic_net
    depends_on:
      db:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8100/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # 4. Next.js 15 Production Frontend Service
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      API_URL: http://api:8100
      NODE_ENV: production
      PORT: 3000
    networks:
      - pelagic_net
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # 5. Reverse Proxy (Nginx) — Single Public Entry Point
  proxy:
    image: nginx:stable-alpine
    ports:
      - "${PORT:-80}:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - pelagic_net
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

networks:
  pelagic_net:
    driver: bridge

volumes:
  db-data:
